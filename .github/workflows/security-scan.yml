name: Security scan

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 11 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secrets / gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.24.3"
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose

  osv:
    name: Dependency vulns / OSV Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install osv-scanner
        run: go install github.com/google/osv-scanner/cmd/osv-scanner@latest
      - name: Run OSV scanner
        run: |
          set -euo pipefail
          "$HOME/go/bin/osv-scanner" --recursive --format json . > osv-results.json || true
          python3 - <<'PY'
          import json, sys

          with open("osv-results.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          severity_rank = {"LOW": 1, "MODERATE": 2, "MEDIUM": 2, "HIGH": 3, "CRITICAL": 4}
          findings = []

          def vuln_severity(vuln):
              max_score = 0.0
              for sev in vuln.get("severity") or []:
                  try:
                      max_score = max(max_score, float(sev.get("score", 0)))
                  except (TypeError, ValueError):
                      pass
              label = (vuln.get("database_specific") or {}).get("severity")
              rank = severity_rank.get(str(label).upper(), 0)
              return max_score, rank, label or ""

          def walk(node, package_name="", package_version="", source=""):
              if isinstance(node, dict):
                  pkg = node.get("package") or {}
                  package_name = pkg.get("name") or package_name
                  package_version = pkg.get("version") or package_version
                  source = node.get("source") or node.get("path") or source
                  vulns = node.get("vulnerabilities") or []
                  for vuln in vulns:
                      score, rank, label = vuln_severity(vuln)
                      vid = vuln.get("id") or vuln.get("modified") or "unknown"
                      findings.append((score, rank, label, vid, package_name, package_version, source))
                  for value in node.values():
                      walk(value, package_name, package_version, source)
              elif isinstance(node, list):
                  for value in node:
                      walk(value, package_name, package_version, source)

          walk(data)
          high = []
          if findings:
              print("OSV findings:")
          for score, rank, label, vid, name, version, source in sorted(findings, reverse=True):
              print(f"- {vid}: {name}@{version} score={score or 'n/a'} severity={label or 'n/a'} source={source or 'n/a'}")
              if score >= 7.0 or rank >= severity_rank["HIGH"]:
                  high.append((score, rank, label, vid, name, version, source))

          if high:
              print(f"Failing because {len(high)} OSV finding(s) are high/critical severity.")
              sys.exit(1)

          print("No high/critical OSV findings.")
          PY

  semgrep:
    name: SAST / Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install semgrep
        run: python -m pip install --upgrade semgrep
      - name: Run Semgrep CI rules
        run: semgrep scan --config p/ci --error

  trivy:
    name: Filesystem, IaC, and container config / Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: Run Trivy filesystem scan
        run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed .
